name: Релиз

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия, например 1.1.0'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Поставить .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Определить версию
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v',''
          } else {
            '${{ github.event.inputs.version }}'
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Версия: $v"

      - name: Обычная сборка
        run: dotnet publish -c Release -r win-x64 --self-contained false -o publish/setup -p:Version=${{ steps.ver.outputs.version }}

      - name: Портативная сборка
        run: >
          dotnet publish -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/portable

      - name: Собрать установщик
        shell: pwsh
        run: |
          # Inno Setup предустановлен на образе windows-latest
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} JL-Monitor-Brightness.iss

      - name: Переименовать портативную
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          Move-Item publish/portable/JL-Monitor-Brightness.exe "publish/JL_MonitorBrightness_${v}_Portable.exe"

      - name: Выложить релиз
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.ver.outputs.version }}
          tag_name: v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            Output/*.exe
            publish/*.exe
